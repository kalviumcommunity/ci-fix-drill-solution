name: CI Pipeline

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (locked)
        # Changed from npm install to npm ci for reproducible installs
        # npm ci reads package-lock.json exactly and fails if it is out of sync
        run: npm ci

      - name: Run unit tests
        # Combined into one job — each GitHub Actions job runs on a fresh machine
        # so node_modules from a separate install job would not be available here
        run: npm test
